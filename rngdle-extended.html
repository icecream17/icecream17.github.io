const tierCol=i=>`var(--c${i})`;
const fmt=x=>x.toLocaleString('en-US');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chance=id=>counts[id]/N;
const oddsTxt=id=>{if(!counts[id])return'';const r=N/counts[id];return'1 in '+fmt(r>=10?Math.round(r):+r.toFixed(1))};
function row(b,extra,cls){
  const e=ep[b.id],t=rarity(chance(b.id));
  return `<div class="b ${cls||''}" style="--col:${tierCol(t)}"><div class="t"><strong>${esc(b.name)}${extra||''}</strong><small>${esc(b.desc)}</small></div><div class="ep">${e?(cls==='sup'?'+0':'+'+fmt(e))+' EP':'…'}<small>${RNAME[t]} · ${oddsTxt(b.id)}</small></div></div>`;
}
let filt='all';
function render(){
  $('sEp').textContent=fmt(st.ep);$('sRolls').textContent=fmt(st.rolls);
  const got=BADGES.filter(b=>st.found[b.id]).length;$('sFound').textContent=got+' / '+BADGES.length;
  const fams={};for(const b of BADGES)(fams[b.fam]=fams[b.fam]||[]).push(b);
  const groups=Object.values(fams).map(g=>g.slice().sort((a,b)=>ep[a.id]-ep[b.id])).filter(g=>filt==='all'||g.some(b=>!!st.found[b.id]===(filt==='got')));
  groups.sort((a,b)=>ep[a[0].id]-ep[b[0].id]);
  $('coll').innerHTML=groups.map(g=>{const f=g.filter(b=>st.found[b.id]),multi=g.length>1;
    const list=g.filter(b=>filt==='all'||!!st.found[b.id]===(filt==='got'));
    return (multi?`<div class="ser">${esc(g[0].fam)} series · ${f.length}/${g.length}</div>`:'')+list.map(b=>row(b,st.found[b.id]?` <small>×${st.found[b.id]}</small>`:'',st.found[b.id]?'':'lock')).join('')}).join('')||'<p class="sub">Nothing here.</p>';
}
let busy=false,ready=false;
function roll(){
  if(busy||!ready)return;busy=true;$('go').disabled=true;$('got').innerHTML='';
  const n=Math.floor(Math.random()*N);let t=0;
  const iv=setInterval(()=>{$('num').textContent=Math.floor(Math.random()*N);if(++t>=12){clearInterval(iv);reveal(n)}},45);
}
const RN=['Trash','Common','Uncommon','Rare','Epic','Anomaly','Mythic'],RC=[5,0,1,2,3,4,5];
function reveal(n){
  const x=ctx(n);$('num').textContent=n;
  const hits=BADGES.filter(b=>b.fn(x)),{best,total:uncapped}=score(hits,ep),used={};
  const total=cappedTotal(n,uncapped,digitCap);
  hits.sort((a,b)=>ep[b.id]-ep[a.id]);
  const html=hits.map(b=>{const first=!used[b.fam]&&ep[b.id]===best[b.fam];if(first)used[b.fam]=1;const fresh=!st.found[b.id];st.found[b.id]=(st.found[b.id]||0)+1;
    return row(b,fresh?'<span class="new">NEW</span>':'',first?'':'sup')}).join('');
  let rar='';if(cuts){let i=0;while(i<6&&total>cuts[i])i++;rar=` · <span style="color:${tierCol(RC[i])}">${RN[i]}</span> roll`}
  st.rolls++;st.ep+=total;save();
  const capNotice=total<uncapped?`<p class="sub" style="text-align:center">EP cap for ${n}: −${fmt(uncapped-total)} EP. All badges still count toward your collection.</p>`:'';
  $('got').innerHTML=`<p class="sub" style="text-align:center">Roll total: <b>${fmt(total)} EP</b>${rar}</p>`+capNotice+(html||'<p class="sub" style="text-align:center">No badges.</p>')+
    (hits.some(b=>used[b.fam]&&ep[b.id]!==best[b.fam])?'<p class="sub" style="text-align:center">Dimmed badges are covered by a higher badge in the same series.</p>':'');
  render();busy=false;$('go').disabled=false;
}
$('go').onclick=roll;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.tabs button').forEach(y=>y.classList.toggle('on',y===b));render()});
$('reset').onclick=()=>{if(confirm('Reset all progress?')){st={rolls:0,ep:0,found:{}};save();$('got').innerHTML='';$('num').textContent='–';render()}};
// Fill in anything missing from PRECALC / CUTS (one-time, cached).
const missing=BADGES.filter(b=>!(b.id in counts)),needCuts=!cuts||missing.length>0;
render();
if(!missing.length&&!needCuts){ready=true}else{
  $('go').disabled=true;const c=Object.create(null),out=new Float64Array(N);let n=0,phase=1;const CH=20000;
  const step=()=>{
    if(phase===1){if(missing.length)tally(missing,c,n,Math.min(n+CH,N));n+=CH;if(n>=N){for(const b of missing)counts[b.id]=c[b.id]||0;refresh();render();phase=2;n=0}}
    else{scoreRange(BADGES,ep,out,n,Math.min(n+CH,N));n+=CH;if(n>=N){cuts=cutsOf(out);
      try{localStorage.setItem(KEY+'c',JSON.stringify({signature,counts:Object.fromEntries(BADGES.map(b=>[b.id,counts[b.id]])),cuts}))}catch(e){}
      $('status').textContent='';$('go').disabled=false;ready=true;
      $('pre').style.display='block';$('pre').textContent='PRECALC: '+BADGES.map(b=>`${b.id}:${counts[b.id]}`).join(',')+'  |  CUTS: ['+cuts.join(',')+']';return}}
    $('status').textContent=`Pre-calculating odds (pass ${phase}/2)… ${Math.min(100,Math.round(n/N*100))}%`;setTimeout(step,0)};
  step();
}
})();
</script></body></html>
